[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-excel-converter"
version = "1.0.0"
description = "Offline PDF table extraction for Excel"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "PyMuPDF>=1.24", "pdfplumber>=0.11", "pytesseract>=0.3.13", "opencv-python>=4.10", "Pillow>=10.4", "numpy>=2.0", "openpyxl>=3.1", "pydantic>=2.8", "platformdirs>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.10", "types-openpyxl>=3.1"]

[project.scripts]
pdf-to-excel = "pdf_to_excel.gui.main_window:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pdf_to_excel"]
ignore_missing_imports = true
disable_error_code = ["misc", "untyped-decorator"]
